name: Setup dependencies
description: Install pnpm + Node with the pnpm store cached, then install dependencies.
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # No `version:` input — reads packageManager: pnpm@9.7.0 from package.json
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        # Node 24.18.0 (Active LTS line). Hard floor is 20.12 regardless —
        # vitest 4's rolldown imports util.styleText, absent on older Node.
        node-version: "24.18.0"
        # Cache the pnpm store (keyed on pnpm-lock.yaml). Robust for native
        # optional deps like rolldown's platform binary — unlike caching
        # node_modules directly, which fails to restore them across jobs.
        cache: pnpm
    - name: Install dependencies
      shell: bash
      # Runs in every job: fast from the warm store (no re-download), and
      # correctly materializes the platform-native binaries vitest needs.
      run: pnpm install --frozen-lockfile
