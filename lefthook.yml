# Lefthook config — https://lefthook.dev/configuration/
#
# Fast checks run on commit; the unit-test suite runs on push.
#   pre-commit -> format (Biome, auto-fix + re-stage), then lint + type check
#   pre-push   -> unit tests
#
# Skip a run when needed with: LEFTHOOK=0 git commit ...

pre-commit:
  jobs:
    # Runs first: auto-format staged files with Biome and re-stage the results.
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc}"
      run: pnpm exec biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # Then lint + type check in parallel on the (now formatted) code.
    - name: checks
      group:
        parallel: true
        jobs:
          - name: lint
            glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
            run: pnpm eslint --no-warn-ignored {staged_files}

          - name: typecheck
            # Gated on staged TS files, but tsc needs the whole project,
            # so it runs project-wide rather than on {staged_files}.
            glob: "*.{ts,tsx}"
            run: pnpm typecheck

pre-push:
  jobs:
    - name: test
      run: pnpm test
